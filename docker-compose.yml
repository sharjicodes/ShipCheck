services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shipcheck
      POSTGRES_PASSWORD: shipcheck_dev_password
      POSTGRES_DB: shipcheck
    ports:
      - "5432:5432"
    volumes:
      - shipcheck_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipcheck -d shipcheck"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - shipcheck_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  shipcheck_pg:
  shipcheck_redis:
